name: supportops-agent

services:
  supportops_api:
    build:
      context: ./app
      dockerfile: Dockerfile
    hostname: supportops_api
    container_name: supportops_api
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      - DATABASE_URL=postgresql://postgres:pg123456@supportops_pg:5432/gsk
      - ES_HOST=http://supportops_es:9200
      - ROOT_PATH=http://localhost:8000
      - REDIS_HOST=supportops_redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-supportops_local_secret}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - ../data:/datasets:ro
      - supportops_nltk_data:/usr/local/nltk_data
    command: ["uvicorn", "app_main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    depends_on:
      - supportops_pg
      - supportops_es
      - supportops_redis
    networks:
      - supportops_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    hostname: supportops_frontend
    container_name: supportops_frontend
    environment:
      - VITE_API_BASE=http://localhost:8000
      - VITE_TITLE=SupportOps Agent
    ports:
      - "5181:5181"
    depends_on:
      - supportops_api
    restart: unless-stopped
    networks:
      - supportops_network

  supportops_es:
    container_name: supportops_es
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    volumes:
      - supportops_esdata:/usr/share/elasticsearch/data
    env_file: .env
    environment:
      - node.name=supportops_es
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=false
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - cluster.routing.allocation.disk.watermark.low=5gb
      - cluster.routing.allocation.disk.watermark.high=3gb
      - cluster.routing.allocation.disk.watermark.flood_stage=2gb
      - TZ=${TIMEZONE}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    mem_limit: ${MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:9200"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: on-failure
    networks:
      - supportops_network

  supportops_pg:
    container_name: supportops_pg
    image: postgres:15-alpine
    environment:
      - POSTGRES_PASSWORD=pg123456
      - POSTGRES_USER=postgres
      - POSTGRES_DB=gsk
    volumes:
      - supportops_pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - supportops_network

  supportops_redis:
    container_name: supportops_redis
    image: redis:7-alpine
    volumes:
      - supportops_redis_data:/data
    restart: unless-stopped
    networks:
      - supportops_network

volumes:
  supportops_esdata:
    driver: local
  supportops_pg_data:
    driver: local
  supportops_redis_data:
    driver: local
  supportops_nltk_data:
    driver: local

networks:
  supportops_network:
    driver: bridge
