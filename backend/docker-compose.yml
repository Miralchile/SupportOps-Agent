name: supportops-agent

services:
  supportops_api:
    build:
      context: ./app
      dockerfile: Dockerfile
    hostname: supportops_api
    container_name: supportops_api
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-pg123456}@supportops_pg:5432/${POSTGRES_DB:-gsk}
      - ES_HOST=http://supportops_es:9200
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-supportops_local_secret}
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - ../data:/datasets:ro
    command: ["uvicorn", "app_main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    depends_on:
      supportops_pg:
        condition: service_healthy
      supportops_es:
        condition: service_healthy
    networks:
      - supportops_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    hostname: supportops_frontend
    container_name: supportops_frontend
    environment:
      - VITE_API_BASE=http://localhost:8000
      - VITE_TITLE=SupportOps Agent
    ports:
      - "5181:5181"
    depends_on:
      - supportops_api
    restart: unless-stopped
    networks:
      - supportops_network

  supportops_es:
    container_name: supportops_es
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    volumes:
      - supportops_esdata:/usr/share/elasticsearch/data
    environment:
      - node.name=supportops_es
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=false
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - cluster.routing.allocation.disk.watermark.low=5gb
      - cluster.routing.allocation.disk.watermark.high=3gb
      - cluster.routing.allocation.disk.watermark.flood_stage=2gb
      - TZ=${TIMEZONE:-Asia/Shanghai}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    mem_limit: ${ES_MEM_LIMIT:-2g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: on-failure
    networks:
      - supportops_network

  supportops_pg:
    container_name: supportops_pg
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pg123456}
      - POSTGRES_DB=${POSTGRES_DB:-gsk}
    volumes:
      - supportops_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks:
      - supportops_network

volumes:
  supportops_esdata:
    driver: local
  supportops_pg_data:
    driver: local

networks:
  supportops_network:
    driver: bridge
